# Начальный безопасный режим: брокер доступен только приложениям на Raspberry Pi.
# Доступ VAKIO из LAN включается отдельным изменением после создания пользователя,
# password_file и ACL и после подтверждения MQTT-топиков конкретной модели.
listener 1883 127.0.0.1
allow_anonymous false
persistence true
persistence_location /var/lib/mosquitto/
