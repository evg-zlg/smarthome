# VAKIO Base Smart этой ревизии не сохраняет MQTT credentials. Поэтому
# gateway и устройство разнесены по listener'ам. LAN-listener дополнительно
# закрыт firewall для всех адресов, кроме фиксированного адреса VAKIO.
per_listener_settings true

listener 1883 127.0.0.1
allow_anonymous false
password_file /etc/mosquitto/passwd
acl_file /etc/mosquitto/acl

listener 1883 192.168.1.183
allow_anonymous true
acl_file /etc/mosquitto/acl-vakio
